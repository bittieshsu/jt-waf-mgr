<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>403 - Request blocked</title>
<style>
  body { margin: 0; font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans TC", "Noto Sans JP", sans-serif; background: #f4f6f9; color: #1c2330; }
  main { max-width: 560px; margin: 12vh auto 0; padding: 28px 24px; background: #fff; border: 1px solid #dde3ea; border-radius: 12px; }
  h1 { font-size: 20px; margin: 0 0 12px; }
  p { margin: 0 0 10px; }
  code { display: inline-block; padding: 2px 8px; border-radius: 6px; background: #eef2f7; font: 14px ui-monospace, Menlo, Consolas, monospace; word-break: break-all; }
  .muted { color: #5e6878; font-size: 14px; }
  @media (prefers-color-scheme: dark) { body { background: #12161d; color: #e3e7ee; } main { background: #1b212b; border-color: #2c3542; } code { background: #252d39; } .muted { color: #98a2b3; } }
</style>
</head>
<body>
<main>
  <h1>403 &middot; 請求已被封鎖 &middot; Request blocked &middot; リクエストはブロックされました</h1>
  <p>這個網站的防護系統封鎖了這次請求。如果你認為這是誤判，請把下面的請求編號告訴網站管理員。</p>
  <p>The site's protection blocked this request. If you think this is a mistake, send the request id below to the site's administrator.</p>
  <p>このサイトの保護機能がリクエストをブロックしました。誤りだと思われる場合は、下のリクエスト ID を管理者に伝えてください。</p>
  <p><code><!--# echo var="request_id" default="-" --></code></p>
  <p class="muted"><!--# echo var="host" default="" --> &middot; <!--# config timefmt="%Y-%m-%d %H:%M:%S %Z" --><!--# echo var="date_local" --></p>
</main>
</body>
</html>
